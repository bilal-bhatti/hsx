[package]
name = "hsx"
version = "0.1.2"
edition = "2021"
description = "Portable cross-shell history substring search (zsh-history-substring-search, but for zsh/bash/dash/ksh)"
license = "MIT"
repository = "https://github.com/bilal-bhatti/hsx"
homepage = "https://github.com/bilal-bhatti/hsx"
authors = ["Bilal Bhatti"]
readme = "README.md"

[[bin]]
name = "hsx"
path = "src/main.rs"

[dependencies]
crossterm = "0.28"

[package.metadata.release]
publish = false
allow-branch = ["main"]

[profile.release]
strip = true
lto = true
opt-level = "z"
codegen-units = 1
panic = "abort"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
